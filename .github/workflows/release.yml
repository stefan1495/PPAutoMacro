name: Package and release
on:
  push:
    branches:
      - master
    tags:
      - "**"

env:
  GITHUB_OAUTH: ${{ secrets.GH_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Package
        uses: BigWigsMods/packager@v2